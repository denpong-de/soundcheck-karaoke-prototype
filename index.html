<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soundcheck Smart Songbook — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ BRAND TOKENS — สลับโลโก้/สีแบรนด์จริงได้ที่นี่ ============ */
:root{
  --brand:#FDF105;        /* เหลือง Soundcheck */
  --brand2:#FFD400;       /* เหลืองเข้ม (ไล่เฉด) */
  --ink:#251F21;          /* ดำโลโก้ */
  --red:#C4161C;          /* แดงเน้น (จากโปสเตอร์) */
  --cyan:#FFF58A;
  --ok:#3ddc97;
  --warn:#ffc933;
  --bg:#0e0d0d;
  --surface:#1a1818;
  --surface2:#272424;
  --line:#3a3535;
  --text:#f4f3fb;
  --muted:#aaa49a;
  --grad:linear-gradient(135deg,#FDF105,#FFD400);
  --font:"Prompt","Noto Sans Thai","Leelawadee UI","Sarabun",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:radial-gradient(1200px 700px at 20% -10%,#2b2800 0,transparent 60%),radial-gradient(900px 600px at 100% 110%,#2a2200 0,transparent 55%),#0a0909;color:var(--text);font-size:14px;line-height:1.4}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;color:inherit}
svg{display:block}

/* ============ PAGE (desktop presentation) ============ */
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.14em;font-size:18px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--grad);color:var(--ink);font-weight:600}
.stage{display:flex;gap:28px;padding:6px 24px 28px;justify-content:center;align-items:flex-start}
.demo{width:340px;flex:none;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
.phones{display:flex;gap:26px;align-items:flex-start}
.pwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.pcap{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.phones.one .pwrap:not(:first-child){display:none}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:0 24px 24px}

/* TV */
.tv{background:#000;border-radius:18px;padding:10px;border:1px solid var(--line);box-shadow:0 20px 60px #0008}
.tv-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px 8px}
.live{color:#ff4d4d}
.tv-screen{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#4d4600,#120f02 70%);padding:14px;display:flex;flex-direction:column;gap:4px}
.tv-title{font-size:20px;font-weight:700;line-height:1.2}
.tv-art{color:#cfc8ee;font-size:13px}
.tv-by{font-size:12px;color:var(--cyan)}
.tv-lyric{margin-top:auto;text-align:center;color:#ffffffaa;font-size:12px}
.tv-prog{height:4px;background:#ffffff22;border-radius:9px;overflow:hidden}
.tv-prog i{display:block;height:100%;background:var(--grad);width:0}
.tv-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tv-flags span{font-size:11px;font-weight:600;background:#ffffff1c;padding:2px 8px;border-radius:6px}
.tv-flags span.hot{background:var(--brand);color:var(--ink)}
.tv-next{font-size:11px;color:#bdb7d8;margin-top:2px}
.eq{position:absolute;right:12px;top:12px;display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:4px;background:var(--cyan);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:22px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h4{font-size:13px;margin-bottom:10px;color:var(--muted);font-weight:500}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-size:12.5px;text-align:center;transition:.15s}
.dbtn:hover{border-color:var(--brand)}
.dbtn.wide{grid-column:1/-1}
.dbtn.danger{border-color:#7a2b3f;color:#ff9db6}
.logbox{display:flex;flex-direction:column;gap:6px;font-size:12px;max-height:150px;overflow:auto}
.logbox div{color:#cfcce6;border-left:2px solid var(--brand2);padding-left:8px}
.logbox small{color:var(--muted)}
details.script{font-size:12.5px;color:#cfcce6}
details.script summary{cursor:pointer;color:var(--muted);font-size:13px}
details.script ol{padding-left:18px;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.fab{display:none}
.sheet-open .fab{display:none!important}

/* ============ PHONE ============ */
.phone{position:relative;width:372px;height:min(790px,calc(100vh - 120px));min-height:640px;border-radius:46px;background:#000;padding:10px;box-shadow:0 30px 80px #000a,0 0 0 2px #2c2c3e;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sb{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600}
.sb .notch{width:84px;height:20px;border-radius:12px;background:#000;border:1px solid #222}
.gate,.app{flex:1;min-height:0;display:flex;flex-direction:column}
.gate{overflow:auto}
.app{position:relative}
.hdr{display:flex;align-items:center;gap:10px;padding:4px 14px 10px;background:var(--brand);color:var(--ink)}
.screen.on .sb{background:var(--brand);color:var(--ink)}
.hlogo{height:26px;display:block;border-radius:4px}
.glogo{width:168px;border-radius:12px;display:block}
.tlogo{height:34px;border-radius:7px;display:block}
.hdr .brand{font-weight:700;letter-spacing:.12em;font-size:13px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr .room{flex:1;font-size:12px;color:#5a5200;font-weight:500}
.me{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--ink);color:#fff;border:1px solid var(--ink);font-size:12.5px}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.main::-webkit-scrollbar{display:none}
/* แถบกำลังเล่น: ลอยทับเนื้อหา พื้นโปร่งฝ้า (frosted glass) เห็นภาพปกเลื่อนผ่านข้างหลัง แบบ Apple Music */
.mini{position:absolute;left:10px;right:10px;bottom:calc(var(--tabh,72px) + 8px);z-index:6;margin:0;border-radius:16px;background:rgba(40,36,8,.55);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid #ffffff26;box-shadow:0 10px 30px #0009;padding:8px 10px 10px;cursor:pointer;overflow:hidden}
.mini.idle{background:rgba(32,30,30,.6);cursor:default;text-align:center;color:#d6d2ca;font-size:12.5px;padding:12px}
.main::after{content:"";display:block;height:calc(var(--minih,70px) + 22px)}
.mini-row{display:flex;align-items:center;gap:10px}
.mini-t{flex:1;min-width:0}
.mini-t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-t span{display:block;font-size:11.5px;color:#cbc4e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-bar,.bar{height:3px;background:#ffffff26;border-radius:9px;margin-top:8px;overflow:hidden}
.mini-bar i,.bar i{display:block;height:100%;background:var(--grad);width:0}
.mini-t b{display:flex;align-items:center;gap:6px}
.mini-t b .tt{font-size:16px;font-weight:600;color:#fff;line-height:1.25;display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-t b .tag{display:inline-block;flex:none;margin:0;white-space:nowrap}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:#ffffff1e;margin-left:4px}
.tag.hot{background:var(--brand);color:var(--ink)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 14px;margin-top:6px;border-top:1px solid var(--line);background:#0d0d17}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;position:relative}
.tabbar button.on{color:#fff}
.tabbar button.on svg{color:var(--brand)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:600}

/* gate */
.g-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 24px 28px;text-align:center;flex:1;justify-content:center}
.g-wrap h2{font-size:21px}
.g-wrap p{color:var(--muted);font-size:13px}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;text-align:center}
.inp:focus{border-color:var(--brand)}
.avrow{display:flex;gap:-4px;justify-content:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--c,var(--line));font-size:17px;margin-left:-6px}
.avrow .av:first-child{margin-left:0}

/* buttons / chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:500;font-size:14px}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:#d9d6ee}
.chip.on{background:var(--grad);border-color:transparent;color:var(--ink);font-weight:600}
.chip.mood.on{background:var(--surface2);border-color:var(--brand);color:#fff}
.link{color:var(--cyan);font-size:12.5px}

/* search */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 10px;display:flex;flex-direction:column;gap:9px}
.sbar{display:flex;align-items:center;gap:8px;margin:0 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 6px 0 14px}
.sbar:focus-within{border-color:var(--brand)}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:none;padding:13px 0;font-size:15px}
.sbar .ico{color:var(--muted)}
.sbar .x{color:var(--muted);padding:6px;display:none}
.sbar.has .x{display:block}
.micb{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:var(--ink);flex:none}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 8px}
.sec-h h3{font-size:15px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:118px}
.card .cap{margin-top:7px}
.card b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{position:relative;display:grid;place-items:center;color:#ffffffcc;font-weight:700;border-radius:12px;background:linear-gradient(135deg,hsl(var(--h) 78% 56%),hsl(calc(var(--h) + 55) 70% 28%));flex:none;overflow:hidden}
.cv::after{content:"♪";position:absolute;right:6px;bottom:-4px;font-size:34px;opacity:.25}
.cvi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv:has(.cvi)::after{display:none}
.cv small{z-index:1;position:absolute;left:6px;top:5px;font-size:9.5px;letter-spacing:.06em;background:#0006;padding:1px 5px;border-radius:5px}
.cv-s{width:46px;height:46px;border-radius:10px}.cv-s::after{font-size:20px}.cv-s small{display:none}
.cv-m{width:118px;height:118px}
.cv-l{width:170px;height:170px;border-radius:22px;margin:0 auto}.cv-l::after{font-size:90px}
.card .add{position:absolute;right:6px;bottom:6px}
.add{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--ink);box-shadow:0 4px 12px #0007;z-index:1}
.add.done{background:#ffffff26;color:var(--ok);box-shadow:none}
.li{display:flex;align-items:center;gap:11px;padding:8px 14px}
.li .t{flex:1;min-width:0}
.li b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .add{position:static}
.resh{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;color:var(--muted);font-size:12.5px}
.resh select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12.5px;outline:none}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px}
.pill{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:5px;background:#ffffff18;color:#d6d2ee;margin-left:4px}

/* queue */
.nowcard{margin:6px 14px 4px;border-radius:16px;padding:11px;background:linear-gradient(135deg,#2d2a07,#1d1b0a);display:flex;gap:11px;align-items:center;cursor:pointer;border:1px solid #ffffff1a}
.nowcard .t{flex:1;min-width:0}
.nowcard small{color:var(--cyan);font-size:11px;font-weight:600}
.nowcard b{display:block;font-size:14.5px}
.qh{padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
.qh h3{font-size:15px}
.hint{font-size:11.5px;color:var(--muted);padding:0 14px 6px}
.eta{margin:2px 14px 6px;padding:8px 12px;border-radius:12px;background:#FDF10522;border:1px solid #FDF10555;font-size:12.5px}
.qi{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 6px;margin:0 10px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative}
.qi.dragging{background:var(--surface2);border-color:var(--brand);box-shadow:0 10px 30px #000a;z-index:4;transform:scale(1.02)}
.grip{color:var(--muted);touch-action:none;cursor:grab;padding:6px 2px}
.qn{width:18px;text-align:center;color:var(--muted);font-size:12px}
.qt{flex:1;min-width:0}
.qt b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{font-style:normal;display:inline-block;margin-top:3px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);white-space:nowrap}
.qa{display:flex;flex-direction:column;gap:4px}
.qa button{width:32px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:#d9d6ee}
.qa button:disabled{opacity:.3}
.qa button:hover:not(:disabled){color:#fff;background:#3a3a55}

/* order */
.osw{display:flex;margin:6px 14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.osw button{flex:1;padding:8px;border-radius:9px;font-size:13px;color:var(--muted)}
.osw button.on{background:var(--grad);color:var(--ink);font-weight:600}
.mi{display:flex;align-items:center;gap:12px;padding:9px 14px}
.mi .e{width:46px;height:46px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:25px;flex:none}
.mi .t{flex:1;min-width:0}
.mi b{display:block;font-size:13.5px;font-weight:500}
.mi span{font-size:12.5px;color:var(--warn)}
.step{display:inline-flex;align-items:center;background:var(--surface2);border-radius:999px;border:1px solid var(--line)}
.step button{width:32px;height:32px;font-size:18px;display:grid;place-items:center}
.step b{min-width:22px;text-align:center;font-size:14px}
.addm{padding:7px 16px;border-radius:999px;background:var(--grad);font-size:13px;font-weight:600;color:var(--ink)}
.cartbar{position:sticky;bottom:calc(var(--minih,70px) + 14px);z-index:5;margin:10px 14px 8px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:16px;background:var(--grad);color:var(--ink);font-weight:700;box-shadow:0 10px 30px #FDF10544;width:calc(100% - 28px)}
.ord{margin:0 14px 10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ord-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ord ul{list-style:none;font-size:13px;color:#d9d6ee;display:flex;flex-direction:column;gap:2px}
.ord .st{display:flex;gap:6px;margin-top:10px;align-items:center}
.ord .st i{flex:1;height:4px;border-radius:3px;background:#ffffff1c}
.ord .st i.on{background:var(--ok)}
.ord .stt{font-size:12px;margin-top:6px;color:var(--ok)}
.sumbox{margin:4px 14px 10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sumbox .tot{font-size:20px;font-weight:700}
.sumbox .per{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* room */
.rcard{margin:6px 14px 10px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#2d2a07,#1d1b0a);border:1px solid #ffffff1a}
.rcard.warn{border-color:var(--red);background:linear-gradient(135deg,#3d1212,#1d1b0a)}
.remain-l{font-size:12px;color:#cbc4e6;margin-top:8px}
.remain{font-size:30px;font-weight:700;line-height:1.15;margin:2px 0 8px;color:var(--brand)}
.rcard.warn .remain{color:#ff9a9a}
.bkbar{height:6px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-bottom:10px}
.bkbar i{display:block;height:100%;background:var(--grad)}
.rcard.warn .bkbar i{background:linear-gradient(90deg,#ff9a9a,#ff5a5a)}
.callbtn{margin-top:12px;width:100%;padding:13px;border-radius:12px;background:var(--grad);color:var(--ink);font-weight:700;font-size:14.5px}
.callbtn:disabled{opacity:.45;cursor:not-allowed}
.extbox{margin:0 14px 10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.extbox .st{display:flex;gap:6px;margin:10px 0 6px}
.extbox .st i{flex:1;height:4px;border-radius:3px;background:#ffffff1c}
.extbox .st i.on{background:var(--ok)}
.extbox .stt{font-size:12.5px;color:var(--ok);margin-bottom:4px}
.rcard h3{font-size:17px}
.rcard p{font-size:12.5px;color:#cbc4e6;margin-top:2px}
.sgrow{display:flex;align-items:center;gap:12px;padding:10px 14px}
.sgrow .t{flex:1}
.sgrow b{font-weight:500;font-size:14px}
.sgrow span{display:block;font-size:12px;color:var(--muted)}
.you{font-size:10.5px;color:var(--ink);background:var(--brand);padding:1px 7px;border-radius:6px;margin-left:6px}
.qrcard{margin:8px 14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.qrcard .q{width:92px;height:92px;background:#fff;border-radius:10px;padding:5px;flex:none}
.qrcard .q img{width:100%;height:100%;object-fit:contain;display:block}
.qrcard b{font-size:15px}
.qrcard ol{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:#d6d2ee;display:flex;flex-direction:column;gap:3px}
.qrcard li::marker{color:var(--brand);font-weight:700}

/* layer / sheets */
.layer,.dlg{position:absolute;inset:0;pointer-events:none;z-index:20}
.layer.open,.dlg.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:#000a;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#161414;border-radius:26px 26px 0 0;padding:10px 18px 24px;animation:up .28s cubic-bezier(.2,.9,.3,1);scrollbar-width:none;border-top:1px solid var(--line)}
.sheet::-webkit-scrollbar{display:none}
.sheet.full{top:30px;max-height:none;background:linear-gradient(180deg,#332e00,#161414 38%)}
.grab{width:42px;height:4px;border-radius:3px;background:#ffffff33;margin:0 auto 12px}
.sheet .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#ffffff1a;display:grid;place-items:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.n-title{font-size:22px;font-weight:700;text-align:center;margin-top:14px}
.n-artist{text-align:center;color:#cbc4e6;font-size:14px}
.n-by{text-align:center;margin-top:8px}
.prog{margin-top:14px}
.prog .bar{height:5px;margin-top:0}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.transport{display:flex;gap:10px;justify-content:center;margin:12px 0}
.round{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--ink)}
.ctl{background:#ffffff0d;border:1px solid #ffffff14;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.ctl-h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:8px}
.ctl-h small{color:var(--muted);font-size:11.5px}
.keyrow{display:flex;align-items:center;justify-content:center;gap:18px}
.keyrow button{width:54px;height:54px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:26px;display:grid;place-items:center}
.keyrow button:active{background:var(--brand);color:var(--ink)}
.keyval{min-width:84px;text-align:center;font-size:30px;font-weight:700}
.keyval small{display:block;font-size:11px;color:var(--muted);font-weight:400}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.sw{width:50px;height:28px;border-radius:999px;background:#ffffff26;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{left:25px}
.lastctl{font-size:12.5px;color:#cfcce6;text-align:center;padding:4px 0}
.mic{text-align:center}
.micbtn{width:84px;height:84px;margin:10px auto 14px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--ink);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #FDF10588}100%{box-shadow:0 0 0 30px #FDF10500}}
.mic h3{font-size:19px}
.mic p{color:var(--muted);font-size:13px;margin:4px 0 8px}
.mic-heard{min-height:34px;font-size:20px;font-weight:600;color:var(--cyan);margin:8px 0 14px}
.eqbars{display:flex;justify-content:center;gap:4px;align-items:center;height:30px}
.eqbars i{width:5px;border-radius:3px;background:var(--brand);animation:eq 0.9s ease-in-out infinite}
.eqbars i:nth-child(2n){animation-delay:.2s;background:var(--brand2)}
.eqbars i:nth-child(3n){animation-delay:.4s}
.sh-h{font-size:17px;font-weight:600;margin:6px 0 12px}
.dlg .box{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:#1b1b2b;border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;animation:fade .2s}
.dlg .box p{margin-bottom:16px;font-size:15px}
.dlg .box .btns{display:flex;gap:10px}
.dlg .box .btns .btn{flex:1}
.cl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cl .e{font-size:24px}.cl .t{flex:1}.cl .t span{display:block;font-size:12px;color:var(--warn)}
.toast{position:absolute;left:12px;right:12px;top:36px;z-index:40;background:#23233a;border:1px solid #ffffff26;border-radius:14px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-14px);pointer-events:none;transition:.25s;box-shadow:0 12px 30px #000a}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{color:var(--cyan);font-weight:600;font-size:13px;flex:none}

/* ============ จอเดี่ยวเต็มหน้าจอ (มือถือ + iPad) — โหมด 3 เครื่องใช้เฉพาะจอคอมพิวเตอร์ >= 1400px ============ */
@media (max-width:1399px){
  .top,.foot,.pcap{display:none}
  .stage{padding:0;display:block}
  .demo{display:none}
  .phones{display:block}
  .phones .pwrap:not(:first-child){display:none}
  .phone{width:100vw;height:100dvh;min-height:0;padding:0;border-radius:0;box-shadow:none}
  .screen{border-radius:0}
  .sb{display:none}
  .hdr{padding-top:max(10px,env(safe-area-inset-top))}
  .demo-on .fab{display:grid}
  .fab{position:fixed;right:12px;bottom:170px;z-index:60;width:42px;height:42px;opacity:.75;border-radius:50%;background:#000c;border:1px solid var(--brand);font-size:10px;font-weight:700;place-items:center;color:#fff}
  .demo.open{display:flex;position:fixed;inset:0;z-index:70;background:#07070d;width:auto;max-height:none;padding:16px;overflow:auto}
}

/* ============ TABLET / iPad — เมนูข้างซ้าย + แถบเพลงล่างเต็มจอ (สไตล์ Spotify / Apple Music) ============ */
@media (min-width:721px) and (max-width:1399px){
  body{font-size:15px}
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hdr hdr" "nav main"}
  .hdr{grid-area:hdr;padding:12px 28px;padding-top:max(12px,env(safe-area-inset-top))}
  .hlogo{height:34px}
  .hdr .room{font-size:13.5px}
  .me{font-size:14px;padding:6px 14px 6px 8px}
  .main{grid-area:main}
  .tabbar{grid-area:nav;display:flex;flex-direction:column;gap:4px;margin:0;padding:18px 12px;border-top:0;border-right:1px solid var(--line);background:#0b0a0a}
  .tabbar button{flex-direction:row;justify-content:flex-start;gap:14px;font-size:15.5px;padding:13px 16px;border-radius:12px}
  .tabbar button.on{background:var(--surface2)}
  .tabbar button svg{width:24px;height:24px}
  .badge{position:static;margin-left:auto;top:auto;left:auto}
  .mini{left:232px;right:0;bottom:0;border-radius:0;border:0;border-top:1px solid #ffffff1f;box-shadow:none;background:rgba(26,24,24,.58);padding:12px 28px 14px}
  .mini.idle{padding:16px}
  .mini .cv-s{width:56px;height:56px;border-radius:12px}
  .mini-t b .tt{font-size:18px}
  .mini-t span{font-size:13px}
  .mini .add{width:46px;height:46px}
  .mini-bar{height:4px;margin-top:10px}
  /* ค้นหา */
  .sticky{padding:14px 0 12px}
  .sbar{margin:0 28px;max-width:640px}
  .chips{padding:0 28px}
  .sec-h{padding:22px 28px 10px}.sec-h h3{font-size:18px}
  .row{padding:0 28px 6px;gap:16px}
  .card{width:156px}.cv-m{width:156px;height:156px;border-radius:14px}
  .card b{font-size:14px}.card span{font-size:12.5px}
  .resh{padding:8px 28px}
  .li{padding:10px 28px}.li b{font-size:15px}
  .cv-s{width:52px;height:52px}
  /* คิว / ห้อง / สั่งของ */
  .main[data-tab=queue] .dyn,.main[data-tab=room] .dyn{max-width:820px;margin:0 auto;padding:8px 0 20px}
  .nowcard,.eta,.rcard,.qrcard,.extbox{margin-left:28px;margin-right:28px}
  .qh,.hint{padding-left:28px;padding-right:28px}
  .qi{margin:0 28px 8px;padding:10px 14px 10px 8px}
  .sgrow{padding:10px 28px}
  .main[data-tab=order] .dyn{padding-bottom:20px}
  .osw{margin:10px 28px}.mi{padding:10px 28px}
  .cartbar{width:calc(100% - 56px);margin:12px 28px}
  .ord,.sumbox{margin-left:28px;margin-right:28px}
  /* หน้าต่างลอย */
  .sheet{left:0;right:0;margin:0 auto;max-width:520px;bottom:24px;border-radius:26px;max-height:88%}
  .sheet.full{left:auto;right:0;top:0;bottom:0;margin:0;width:460px;max-width:100%;max-height:none;border-radius:26px 0 0 26px;animation:slideR .3s cubic-bezier(.2,.9,.3,1)}
  @keyframes slideR{from{transform:translateX(40px);opacity:0}}
  .cv-l{width:210px;height:210px}
  .toast{left:0;right:0;margin:0 auto;max-width:480px;top:84px}
  .dlg .box{max-width:420px;margin:0 auto}
  .g-wrap{max-width:460px;margin:0 auto;width:100%}
}
/* iPad แนวนอนที่จอเตี้ย (เช่น iPad mini): ย่อแผงควบคุมเพลงให้เห็นครบโดยไม่ต้องเลื่อน */
@media (min-width:721px) and (max-width:1399px) and (max-height:820px){
  .sheet.full{padding:8px 20px 14px}
  .cv-l{width:112px;height:112px;border-radius:16px}
  .n-title{font-size:19px;margin-top:8px}
  .n-by{margin-top:4px}
  .prog{margin-top:8px}
  .transport{margin:8px 0}
  .round{width:48px;height:48px}
  .ctl{padding:8px 14px;margin-bottom:7px}
  .ctl-h{margin-bottom:4px}
  .keyrow button{width:44px;height:44px;font-size:22px}
  .keyval{font-size:26px}
  input[type=range]{height:22px}
  .lastctl{padding:2px 0}
}
/* iPad จอกว้าง (แนวนอน / 11" ขึ้นไป): ผลค้นหาและเมนูอาหารแสดง 2 คอลัมน์ */
@media (min-width:1000px) and (max-width:1399px){
  .res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
  .res>.sec-h,.res>.row,.res>.resh,.res>.empty,.res>div[style]{grid-column:1/-1}
  .li{min-width:0}
  .main[data-tab=order] .dyn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
  .main[data-tab=order] .dyn>*:not(.mi):not(.ord){grid-column:1/-1}
}

function advance(){S.paused=false;const n=S.queue.shift();if(n){S.now={songId:n.songId,by:n.by,elapsed:0};S.key=0}else S.now=null}
function addToQueue(songId,by){
  const s=SONG(songId);S.queue.push({qid:S.uid++,songId,by});
  const started=!S.now;if(started)advance();
  notify(by,`${nm(by)} เพิ่ม “${esc(s.title)}”`);emit();
  return started?0:S.queue.length;
}
function removeQ(qid,by){const i=S.queue.findIndex(q=>q.qid===qid);if(i<0)return;const [it]=S.queue.splice(i,1);S.lastRemoved={it,i};notify(by,`${nm(by)} ลบ “${esc(SONG(it.songId).title)}” ออกจากคิว`);emit()}
function undoRemove(by){const r=S.lastRemoved;if(!r)return;S.queue.splice(Math.min(r.i,S.queue.length),0,r.it);S.lastRemoved=null;notify(by,`${nm(by)} นำ “${esc(SONG(r.it.songId).title)}” กลับเข้าคิว`);emit()}
function moveNext(qid,by){const i=S.queue.findIndex(q=>q.qid===qid);if(i<=0)return;const [it]=S.queue.splice(i,1);S.queue.unshift(it);notify(by,`${nm(by)} ดัน “${esc(SONG(it.songId).title)}” ขึ้นเป็นเพลงถัดไป`);emit()}
function reorder(ids,by){
  const nq=ids.map(id=>S.queue.find(q=>q.qid===id)).filter(Boolean);
  if(nq.length!==S.queue.length)return;
  if(nq.every((q,i)=>q===S.queue[i]))return;
  S.queue=nq;notify(by,`${nm(by)} จัดลำดับคิวใหม่`);emit();
}

function placeOrder(by,cart){
  const lines=Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({id,q}));if(!lines.length)return;
  const o={id:S.uid++,by,lines,t:Date.now(),status:0,sess:S.sessionId};S.orders.push(o);
  setTimeout(()=>{if(S.orders.includes(o)){o.status=1;emit()}},6000+Math.random()*3000);
  setTimeout(()=>{if(S.orders.includes(o)){o.status=2;emit()}},15000+Math.random()*4000);
  const sum=lines.map(l=>`${ITEM(l.id).n} ×${l.q}`).slice(0,2).join(', ')+(lines.length>2?' …':'');
  notify(by,`${nm(by)} สั่ง ${esc(sum)}`);emit();
}

function requestExtend(by,min){
  if(S.ext&&S.ext.status<2)return false;
  const e={id:S.uid++,by,min,t:Date.now(),status:0,sess:S.sessionId};S.ext=e;
  notify(by,`🔔 ${nm(by)} เรียกพนักงานเพื่อจองเวลาเพิ่ม ${fmtMin(min)}`);emit();
  const live=()=>S.ext===e&&e.sess===S.sessionId;
  setTimeout(()=>{if(live()&&e.status===0){e.status=1;notify(0,'🧑‍🍳 พนักงานกำลังไปที่ห้อง 5');emit()}},5000);
  setTimeout(()=>{if(live()&&e.status===1){
    const ne=Math.max(bookEnd(),Date.now())+min*60000;S.bookMin=(ne-S.sessionStart)/60000;e.status=2;
    notify(0,`✅ ต่อเวลาเพิ่ม ${fmtMin(min)} เรียบร้อย — หมดเวลา ${hhmm(ne)}`);emit();
    setTimeout(()=>{if(S.ext===e){S.ext=null;emit()}},25000)}},13000);
  return true;
}

class Phone{
  constructor(label,pre){
    this.label=label;this.me=null;this.joinedSession=null;this.stage=pre?'app':'name';
    this.tab='search';this.query='';this.lang='all';this.mood=null;this.sort='pop';this.sheet=null;this.dialog=null;
    this.cart={};this.cat='drink';this.oview='menu';this.layerKey=null;this.mainTab=null;this.gateKey=null;this.dragging=null;this.voice=null;
    this.wrap=document.createElement('div');this.wrap.className='pwrap';
    this.cap=document.createElement('div');this.cap.className='pcap';
    this.el=document.createElement('div');this.el.className='phone';this.el.innerHTML=SHELL;
    this.wrap.append(this.el,this.cap);this.bind();
  }
  $(s){return this.el.querySelector(s)}
  toast(html,undo){
    const t=this.$('.toast');t.innerHTML=`<span>${html}</span>${undo?'<button data-act="undo">ย้อนกลับ</button>':''}`;t.classList.add('show');
    clearTimeout(this.tt);this.tt=setTimeout(()=>t.classList.remove('show'),undo?4500:2800);
  }
  /* ---------- events ---------- */
  bind(){
    const e=this.el;
    e.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;this.act(b.dataset.act,b)});
    e.addEventListener('input',ev=>{
      const t=ev.target,k=t.dataset.key;
      if(k==='q'){this.query=t.value;this.renderSearch()}
      else if(k==='name'){this.$('[data-act=join]').disabled=!t.value.trim()}
      else if(k==='newname'){this.$('[data-act=savename]').disabled=!t.value.trim()}
      else if(t.dataset.slider){S[t.dataset.slider]=+t.value;emit('ctl')}
    });
    e.addEventListener('change',ev=>{
      const t=ev.target;
      if(t.dataset.key==='sort'){this.sort=t.value;this.renderSearch()}
      else if(t.dataset.slider){const n=t.dataset.slider==='music'?'เสียงดนตรี':'เสียงนักร้อง';ctl(this.me,`ปรับ${n}เป็น ${t.value}%`)}
    });
    e.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'&&ev.target.dataset.key==='name'&&ev.target.value.trim())this.act('join');
      if(ev.key==='Enter'&&ev.target.dataset.key==='newname'&&ev.target.value.trim())this.act('savename');
    });
    // drag reorder
    e.addEventListener('pointerdown',ev=>{
      const g=ev.target.closest('[data-drag]');if(!g)return;
      const item=g.closest('.qi');this.dragging={item,list:item.parentElement,id:ev.pointerId};
      item.classList.add('dragging');try{g.setPointerCapture(ev.pointerId)}catch(_){}ev.preventDefault();
    });
    e.addEventListener('pointermove',ev=>{
      const d=this.dragging;if(!d)return;
      const y=ev.clientY,sibs=[...d.list.children].filter(c=>c!==d.item);let before=null;
      for(const s of sibs){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break}}
      d.list.insertBefore(d.item,before);
      const m=this.$('.main'),mr=m.getBoundingClientRect();
      if(y<mr.top+50)m.scrollTop-=10;else if(y>mr.bottom-50)m.scrollTop+=10;
    });
    const end=()=>{

      else if(key==='ext')L.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div><button class="x" data-act="close" aria-label="ปิด">${ic('x',18)}</button><div class="sh-h">🔔 จองเวลาเพิ่ม</div><div class="ebody"></div></div>`;

  renderExt(){

  renderCart(){
    const B=this.$('.cbody');if(!B)return;
    const ents=Object.entries(this.cart);if(!ents.length){this.sheet=null;this.renderLayer();return}
    const tot=ents.reduce((a,[id,q])=>a+ITEM(id).p*q,0);
    B.innerHTML=ents.map(([id,q])=>{const m=ITEM(id);return `<div class="cl"><div class="e">${m.e}</div><div class="t">${m.n}<span>${baht(m.p*q)}</span></div><div class="step"><button data-act="csub" data-id="${id}">−</button><b>${q}</b><button data-act="cadd" data-id="${id}">＋</button></div></div>`}).join('')
      +`<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin:14px 0">ยอดรวม<span>${baht(tot)}</span></div><button class="btn primary block" data-act="cart-send">ส่งออเดอร์ให้ครัว</button><div style="text-align:center;margin-top:10px"><button class="link" data-act="cart-clear">ล้างตะกร้า</button></div>`;
  }
  updateNow(){
    const L=this.$('.layer');if(!S.now)return;const s=SONG(S.now.songId);
    const set=(sel,v,html)=>{const e=L.querySelector(sel);if(e){html?e.innerHTML=v:e.textContent=v}};
    const cv=L.querySelector('.n-cover');cv.style.setProperty('--h',s.h);cv.querySelector('small').textContent=LTAG[s.lang];
    let im=cv.querySelector('.cvi');
    if(!im){im=document.createElement('img');im.className='cvi';im.alt='';im.onerror=function(){coverErr(this)};cv.prepend(im)}
    if(im.dataset.id!==String(s.id)){im.dataset.id=s.id;im.dataset.i=0;im.src=`covers/${s.id}.jpg`}
    set('.n-title',s.title);set('.n-artist',s.artist);set('.n-by','ร้องโดย '+sgChip(S.now.by,this.me).replace(/^<em/,'<em style="margin:0"'),1);
    set('.n-dur',fmt(s.dur));set('.kv',keyStr(S.key));
    L.querySelector('[data-act=playpause].round').innerHTML=ic(S.paused?'play':'pause',26);
    set('.mv',S.music+'%');set('.vv',S.vocalOn?S.vocal+'%':'ปิด');
    const sw=L.querySelector('.sw');sw.classList.toggle('on',S.vocalOn);
    const m=L.querySelector('[data-slider=music]'),v=L.querySelector('[data-slider=vocal]');
    if(document.activeElement!==m)m.value=S.music;if(document.activeElement!==v)v.value=S.vocal;v.disabled=!S.vocalOn;v.style.opacity=S.vocalOn?1:.35;
    const lc=S.lastCtl;set('.lastctl',lc?`ล่าสุด: ${nm(lc.by)} ${esc(lc.text)} · <span data-ago="${lc.t}">${ago(lc.t)}</span>`:'ทุกคนในห้องปรับเสียงและคีย์ได้ · ใครกดล่าสุดจะเป็นค่าที่ใช้',1);
  }
  renderDialog(){
    const D=this.$('.dlg');
    if(!this.dialog||!S.now){D.classList.remove('open');D.innerHTML='';return}
    D.classList.add('open');
    D.innerHTML=`<div class="scrim" data-act="dlg-cancel"></div><div class="box"><p>ข้ามเพลง “${esc(SONG(S.now.songId).title)}”<br>ของ ${nm(S.now.by)} ?</p><div class="btns"><button class="btn" data-act="dlg-cancel">ยกเลิก</button><button class="btn primary" data-act="dlg-skip">ข้ามเลย</button></div></div>`;
  }
  /* ---------- voice ---------- */
  startVoice(){
    this.sheet='mic';this.update();this.voice={sim:false};
    const heard=t=>{const h=this.$('.mic-heard');if(h)h.textContent=t||' '};
    const finish=t=>{this.stopVoice();this.tab='search';this.mainTab=null;this.query=t.trim();this.update();this.toast(`🎙 ค้นหา “${esc(t.trim())}”`)};
    const fallback=()=>{
      if(!this.voice||this.voice.sim)return;this.voice.sim=true;
      const n=this.$('.mic-note');if(n)n.textContent='ไมค์ใช้ไม่ได้บนอุปกรณ์/เบราว์เซอร์นี้ — ใช้โหมดจำลองเสียง';
      const t=rnd(['บอดี้สแลม','yoasobi','บีทีเอส','adele','เลมอน']);let i=0;
      this.voice.timer=setInterval(()=>{i++;heard(t.slice(0,i));if(i>=t.length){clearInterval(this.voice.timer);this.voice.t2=setTimeout(()=>finish(t),500)}},130);
    };
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){fallback();return}
    try{
      const r=new SR();r.lang=VL[this.lang];r.interimResults=true;r.maxAlternatives=1;this.voice.rec=r;let got=false;
      r.onresult=ev=>{const tr=[...ev.results].map(x=>x[0].transcript).join('');heard(tr);if(ev.results[ev.results.length-1].isFinal){got=true;this.voice&&(this.voice.t2=setTimeout(()=>finish(tr),350))}};
      r.onerror=()=>fallback();
      r.onend=()=>{if(!got&&this.voice&&!this.voice.sim&&this.sheet==='mic')fallback()};
      r.start();
    }catch(_){fallback()}
  }
  stopVoice(){
    const v=this.voice;if(v){clearInterval(v.timer);clearTimeout(v.t2);try{v.rec&&v.rec.abort()}catch(_){}}
    this.voice=null;if(this.sheet==='mic'){this.sheet=null;this.update()}
  }
}

  PH.forEach(p=>box.appendChild(p.wrap));
  box.classList.toggle('one',$('#modeSeg .on').dataset.m==='1');
  buildDemo();emit();$("#topLogo").src=LOGO;{let l=document.querySelector("link[rel=icon]");if(!l){l=document.createElement("link");l.rel="icon";document.head.appendChild(l)}l.href=LOGO}
  clearInterval(ticker);
  ticker=setInterval(()=>{
    if(S.now&&!S.paused){
      S.now.elapsed++;
      if(S.now.elapsed>=SONG(S.now.songId).dur){const t=SONG(S.now.songId).title;advance();log(S.now?`▶ ถึงคิว ${nm(S.now.by)} ร้อง “${esc(SONG(S.now.songId).title)}”`:`จบเพลง “${esc(t)}” — คิวว่าง`);emit();return}
    }
    PH.forEach(p=>p.tick());tickDemo();
    const d=new Date(),c=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$$('.clock').forEach(e=>e.textContent=c);
  },1000);
}
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));$('#phones').classList.toggle('one',b.dataset.m==='1')});
if(/[?&]demo=1/.test(location.search))document.body.classList.add('demo-on'); // มือถือ: เปิดปุ่ม DEMO ด้วย ?demo=1
addEventListener('resize',()=>PH.forEach(p=>p.syncBars()));
$('#fab').addEventListener('click',()=>$('#demo').classList.toggle('open'));
boot();
</script>
</body>
</html>
